name: Deploy to GitHub Pages

# Lint and unit tests gate every build; the site deploys only if they pass.
# Run manually from the Actions tab with "Run workflow" at any time.
on:
  push:
    branches:
      - main
      - claude/build-todo-app-BLpsC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple concurrent deploys
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # Must run before the build so Next.js gets the Pages base path
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Extra bot-server origins for the Content-Security-Policy, e.g. https://bot.example.com
          NEXT_PUBLIC_BOT_ORIGINS: ${{ vars.BOT_ORIGINS }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
